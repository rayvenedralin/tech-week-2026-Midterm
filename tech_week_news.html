<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Newsletter & Bulletins | Tech Week 2026</title>
  <meta name="description" content="Official STUCCS Tech Week 2026 Newsletter and Summit Bulletins. St. Timothy University College of Computer Studies.">
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Press+Start+2P&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background-color: #061436;
      color: #E2E8F0;
      overflow-x: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .banner-stage {
      aspect-ratio: 16 / 9;
      width: 100%;
      max-width: 1600px;
      min-height: 100vh;
      position: relative;
      background: radial-gradient(120% 100% at 50% 0%, #123b70 0%, #091d4a 55%, #050d26 100%);
      box-shadow: 0 25px 80px -15px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(56, 189, 248, 0.15);
    }

    @media (min-width: 1024px) {
      .banner-stage {
        min-height: auto;
        max-height: 920px;
      }
    }

    .cyber-grid {
      background-size: 48px 48px;
      background-image: 
        linear-gradient(to right, rgba(0, 240, 255, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
      mask-image: radial-gradient(ellipse at 50% 40%, black 30%, transparent 75%);
    }

    /* Navigation Bar: Exact Image 1 Royal Blue Capsule with Gloss Sheen */
    .glass-capsule {
      position: relative;
      background: linear-gradient(180deg, #1e70eb 0%, #0d52c7 100%) !important;
      border: 1.5px solid rgba(160, 235, 255, 0.9) !important;
      border-radius: 9999px;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.65), 0 0 22px rgba(0, 160, 255, 0.45);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      overflow: hidden;
    }

    .glass-capsule::after {
      content: '';
      position: absolute;
      top: -28%;
      right: -8%;
      width: 55%;
      height: 95%;
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.42) 0%, rgba(255, 255, 255, 0.1) 50%, transparent 72%);
      transform: rotate(-15deg);
      pointer-events: none;
      z-index: 2;
    }

    /* Underline Navigation Bar System matching Image 1 */
    .nav-link-btn {
      position: relative;
      width: 86px;
      padding: 6px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: rgba(219, 234, 254, 0.85);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      text-decoration: none;
      transition: color 0.15s ease;
      white-space: nowrap;
      z-index: 3;
    }

    .nav-link-btn:hover {
      color: #ffffff;
    }

    .nav-link-btn.active {
      color: #ffffff;
    }

    .nav-link-btn .nav-text {
      position: relative;
      display: inline-block;
      padding-bottom: 4px;
    }

    .nav-link-btn.active .nav-text::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: #ffffff;
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.75);
      border-radius: 1px;
    }

    .nav-link-btn:not(.active):hover .nav-text::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 1px;
    }

    /* Falling Binary Rain Animation */
    .binary-rain {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
      opacity: 0.9;
    }

    .binary-stream {
      position: absolute;
      top: 0;
      color: rgba(56, 189, 248, 0.52);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      line-height: 1.55;
      letter-spacing: 0.12em;
      white-space: pre;
      text-shadow: 0 0 6px rgba(0, 240, 255, 0.4);
      animation: binary-stream-fall var(--stream-duration, 10s) linear infinite;
      animation-delay: var(--stream-delay, 0s);
      pointer-events: none;
      user-select: none;
    }

    .binary-stream::first-line {
      color: #ffffff;
      text-shadow: 0 0 8px #00f0ff, 0 0 16px rgba(0, 240, 255, 0.95);
      font-weight: 700;
    }

    .binary-stream.shock,
    .binary-stream.lit {
      color: #00f0ff !important;
      text-shadow: 0 0 8px #00f0ff, 0 0 20px #00f0ff, 0 0 35px rgba(0, 240, 255, 1) !important;
      filter: brightness(2.2);
    }

    @keyframes binary-stream-fall {
      0% {
        transform: translateY(-100%);
        opacity: 0;
      }
      3% {
        opacity: var(--stream-opacity, 0.7);
      }
      92% {
        opacity: var(--stream-opacity, 0.7);
      }
      100% {
        transform: translateY(980px);
        opacity: 0;
      }
    }

    /* Image 1 Showcase Frame: Deep Cyber Rounded Container */
    .newsletter-showcase-frame {
      position: relative;
      background: radial-gradient(130% 120% at 50% 10%, rgba(10, 26, 62, 0.92) 0%, rgba(4, 12, 32, 0.98) 100%);
      border: 3px solid rgba(56, 189, 248, 0.45);
      border-radius: 28px;
      box-shadow: 
        0 30px 80px -15px rgba(0, 0, 0, 0.9),
        0 0 50px rgba(0, 160, 255, 0.35),
        inset 0 1.5px 3px rgba(255, 255, 255, 0.3),
        inset 0 -2px 4px rgba(0, 10, 30, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      overflow: hidden;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .newsletter-showcase-frame:hover {
      border-color: rgba(160, 235, 255, 0.75);
      box-shadow: 
        0 35px 90px -15px rgba(0, 0, 0, 0.95),
        0 0 65px rgba(0, 240, 255, 0.5),
        inset 0 1.5px 3px rgba(255, 255, 255, 0.5);
    }

    .newsletter-showcase-frame::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(0, 240, 255, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
      z-index: 1;
    }

    .newsletter-showcase-frame::after {
      content: '';
      position: absolute;
      top: -30%;
      right: -10%;
      width: 60%;
      height: 70%;
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0.05) 50%, transparent 70%);
      transform: rotate(-15deg);
      pointer-events: none;
      z-index: 2;
    }

    .newsletter-img {
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
      transition: transform 0.3s ease;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: high-quality;
    }

    .newsletter-img:hover {
      transform: scale(1.008);
    }

    /* Back / Action Capsule Button matching Image 1 */
    .btn-capsule-action {
      position: relative;
      background: linear-gradient(180deg, #1e70eb 0%, #0d52c7 100%) !important;
      border: 1.5px solid rgba(160, 235, 255, 0.9) !important;
      border-radius: 9999px;
      color: #ffffff !important;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.6), 0 0 20px rgba(0, 160, 255, 0.45);
      text-decoration: none;
    }

    .btn-capsule-action::after {
      content: '';
      position: absolute;
      top: -28%;
      right: -8%;
      width: 55%;
      height: 95%;
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.42) 0%, rgba(255, 255, 255, 0.1) 50%, transparent 72%);
      transform: rotate(-15deg);
      pointer-events: none;
      z-index: 2;
    }

    .btn-capsule-action:hover {
      transform: translateY(-2px);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.8), 0 0 30px rgba(0, 240, 255, 0.7);
      border-color: #ffffff !important;
    }
  </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-2 sm:p-6 lg:p-8 bg-[#061436]">

  <main id="bannerContainer" class="banner-stage rounded-2xl md:rounded-3xl overflow-hidden flex flex-col justify-between border border-slate-800 relative select-none">
    
    <!-- Background Canvas for Circuit Particles & Traces -->

    <div class="absolute bottom-0 right-10 w-[450px] h-[250px] bg-blue-600/10 rounded-full blur-[90px] pointer-events-none"></div>


    <!-- Navigation Header matching Image 1 -->
    <nav class="relative z-10 w-full px-6 md:px-12 pt-6 flex items-center justify-between">

      <a href="tech_week_contact.html" class="btn-capsule-action px-5 py-2 text-xs font-mono font-bold flex items-center gap-2 cursor-pointer text-white" aria-label="Back to Connect">

      <!-- Navigation Pill matching Image 1 (Active: Connect) -->
      <div class="glass-capsule flex items-center gap-1 px-3 py-1.5 rounded-full text-[11px] font-mono uppercase tracking-wider select-none">
        <a href="index.html" class="nav-link-btn"><span class="nav-text">Home</span></a>
        <a href="tech_week_explore.html" class="nav-link-btn"><span class="nav-text">Explore</span></a>
        <a href="tech_week_exhibits.html" class="nav-link-btn"><span class="nav-text">Exhibits</span></a>

    </nav>

    <!-- Main Showcase Center: Exact Match to User Image 1 -->
    <section class="relative z-10 px-4 sm:px-8 md:px-14 py-4 sm:py-6 my-auto flex flex-col items-center justify-center w-full">
      
      <!-- Top Pill Indicator -->
      <div class="glass-capsule mb-4 px-5 py-1.5 rounded-full text-[10px] sm:text-[11px] font-mono uppercase tracking-wider text-cyan-200 font-bold flex items-center gap-2 shadow-[0_0_15px_rgba(0,160,255,0.3)]">
        <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-pulse shadow-[0_0_8px_#00f0ff]"></span>

      </div>

      <!-- Image 1 Center Frame: Cyber Rounded Container around STUCCS Newsletter Header -->

        <!-- Direct PDF vector canvas renderer for mathematical vector precision -->
        <canvas id="newsletterCanvas" class="newsletter-img w-full h-auto object-contain relative z-10" style="display: none;"></canvas>
        <!-- Immediate High-DPI 2400px raster fallback -->
        <img id="newsletterImg" 
             src="STUCCS Newsletter Header.png?v=3" 
             srcset="STUCCS Newsletter Header.png?v=3 1x, STUCCS Newsletter Header.png?v=3 2x"
             alt="STUCCS Tech Week 2026 Newsletter Header - St. Timothy University College of Computer Studies"

      <!-- Quick Action Badges matching Image 1 (Exactly 2 Buttons) -->
      <div class="flex items-center justify-center gap-3.5 mt-5">

        <a href="STUCCS Newsletter Header.jpg" download="STUCCS Newsletter Header.jpg" class="btn-capsule-action px-5 sm:px-6 py-2 sm:py-2.5 text-xs sm:text-sm font-mono font-bold flex items-center gap-2 hover:text-white transition-all cursor-pointer">
          <svg class="w-4 h-4 text-cyan-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
          </svg>

        <!-- Button 2: @STUCCS.edu.ph -->
        <a href="mailto:info@STUCCS.edu.ph" class="btn-capsule-action px-5 sm:px-6 py-2 sm:py-2.5 text-xs sm:text-sm font-mono font-bold flex items-center gap-2 hover:text-white transition-all cursor-pointer">
          <svg class="w-4 h-4 text-cyan-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
          </svg>
          <span>@STUCCS.edu.ph</span>
        </a>
      </div>

    </section>

    <!-- Institutional Footer Bar with Official University Email -->
    <footer class="relative z-10 w-full px-6 md:px-12 pb-6 pt-4 border-t border-cyan-500/10 bg-slate-950/40 text-center text-[11px] font-mono flex items-center justify-between">
      <a href="mailto:info@STUCCS.edu.ph" class="text-cyan-300 hover:text-white transition-colors font-mono">@STUCCS.edu.ph</a>
      <span class="text-cyan-400/80">#TechWeek2026</span>
    </footer>

  </main>

  <script>
    /* Direct PDF vector rendering using PDF.js for 100% vector crispness */
    (function initPdfRenderer() {
      const canvas = document.getElementById('newsletterCanvas');
      const fallback = document.getElementById('newsletterImg');
      if (!window.pdfjsLib || !canvas) return;

      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

      pdfjsLib.getDocument('STUCCS Newsletter Header.pdf?v=3').promise.then(function(pdf) {
        return pdf.getPage(1);
      }).then(function(page) {
        const scale = 4; // 4x scale yields 2400 x 800 ultra-high resolution
        const viewport = page.getViewport({ scale: scale });
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        const ctx = canvas.getContext('2d', { alpha: false });
        return page.render({ canvasContext: ctx, viewport: viewport }).promise;
      }).then(function() {
        canvas.style.display = 'block';
        if (fallback) fallback.style.display = 'none';
      }).catch(function(err) {
        console.info('PDF render note: using high-DPI 2400px raster fallback', err);
      });
    })();

    /* Circuit Background Canvas */
    (function initCircuitBackground() {
      const canvas = document.getElementById('circuitCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let width, height;

      function resize() {
        const rect = canvas.getBoundingClientRect();
        width = canvas.width = rect.width;
        height = canvas.height = rect.height;
      }
      window.addEventListener('resize', resize);
      resize();

      const particles = [];
      const particleCount = 28;
      for (let i = 0; i < particleCount; i++) {
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 0.4,
          vy: (Math.random() - 0.5) * 0.4,
          r: Math.random() * 1.5 + 0.8
        });
      }

      function draw() {
        ctx.clearRect(0, 0, width, height);
        particles.forEach((p, i) => {
          particles.slice(i + 1).forEach(p2 => {
            const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
            if (dist < 130) {
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.strokeStyle = `rgba(0, 240, 255, ${0.12 * (1 - dist / 130)})`;
              ctx.stroke();
            }
          });

          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0 || p.x > width) p.vx *= -1;
          if (p.y < 0 || p.y > height) p.vy *= -1;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(0, 240, 255, 0.5)';
          ctx.fill();
        });
        requestAnimationFrame(draw);
      }
      draw();
    })();

    /* Falling Animated Binary Rain */
    (function initBinaryRain() {
      const banner = document.getElementById('bannerContainer') || document.querySelector('main');
      if (!banner) return;
      document.querySelectorAll('.binary-rain').forEach(el => el.remove());
      const rain = document.createElement('div');
      rain.className = 'binary-rain';
      banner.appendChild(rain);
      const streams = [];
      const createCode = () => Array.from({ length: 14 + Math.floor(Math.random() * 10) }, () => {
        const width = 4 + Math.floor(Math.random() * 5);
        return Array.from({ length: width }, () => (Math.random() > 0.5 ? '1' : '0')).join('');
      }).join('\n');

      const streamCount = 22;
      for (let i = 0; i < streamCount; i++) {
        const stream = document.createElement('pre');
        stream.className = 'binary-stream';
        stream.textContent = createCode();
        const leftPercent = 2 + (i * (94 / streamCount)) + (Math.random() * 1.5 - 0.75);
        stream.style.left = `${leftPercent}%`;
        const dur = 8 + Math.random() * 6;
        const delay = -Math.random() * 12;
        const opacity = 0.38 + Math.random() * 0.42;
        stream.style.setProperty('--stream-duration', `${dur}s`);
        stream.style.setProperty('--stream-delay', `${delay}s`);
        stream.style.setProperty('--stream-opacity', opacity.toString());
        rain.appendChild(stream);
        streams.push(stream);
      }

      banner.addEventListener('pointermove', event => {
        streams.forEach(stream => {
          const bounds = stream.getBoundingClientRect();
          const hit = event.clientX >= bounds.left - 24 && event.clientX <= bounds.right + 24 && event.clientY >= bounds.top && event.clientY <= bounds.bottom;
          stream.classList.toggle('lit', hit);
        });
      });
      banner.addEventListener('pointerleave', () => streams.forEach(s => s.classList.remove('lit')));
      setInterval(() => {
        streams.forEach(stream => {
          if (!stream.classList.contains('lit') && Math.random() > 0.55) {
            stream.textContent = createCode();
          }
        });
      }, 2200);
    })();
  </script>
